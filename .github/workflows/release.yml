name: release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      # macos-14 covers both arch slices via Nuitka cross-build; Intel Macs
      # download the x86_64 artifact via the Homebrew formula.
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run deps

      - run: mise run release-build
      - name: Rename to platform-tagged filename
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            mv dist/gampan dist/gampan-darwin-arm64
          else
            mv dist/gampan dist/gampan-linux-x86_64
          fi

      - if: runner.os == 'macOS'
        env:
          NUITKA_MACOS_ARCH: x86_64
        run: mise run release-build
      - if: runner.os == 'macOS'
        run: mv dist/gampan dist/gampan-darwin-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: gampan-${{ matrix.os }}
          path: dist/gampan-*

  knope:
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2

      - id: knope
        run: |
          if mise exec -- knope prepare-release --dry-run >/dev/null 2>&1; then
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.knope.outputs.has_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "knope-release-bot"
          git config user.email "actions@users.noreply.github.com"
          mise exec -- knope release

      - if: steps.knope.outputs.has_release == 'true'
        uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true

      - if: steps.knope.outputs.has_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver=$(grep -E '^version *=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          gh release upload "v$ver" \
            artefacts/gampan-darwin-arm64 \
            artefacts/gampan-darwin-x86_64 \
            artefacts/gampan-linux-x86_64
