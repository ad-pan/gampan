[settings]
# Refuse to install a tool whose URL/checksum isn't already pinned in mise.lock.
locked = true

[tools]
python = "3.12"
uv = "latest"
# binstall avoids the Rust toolchain; reproducibility is anchored by mise.lock.
"cargo:knope" = { version = "latest", binstall = true }

[tasks.deps]
run = "uv sync --extra dev"
description = "Install all project dependencies (including dev extras)"

[tasks.test]
run = "uv run pytest"
description = "Run all unit + integration tests"

[tasks.lint]
run = "uv run ruff check src tests && uv run ruff format --check src tests"
description = "Lint and format-check with ruff"

[tasks.typecheck]
run = "uv run mypy src"
description = "Static type checking with mypy"

[tasks.validate]
run = "uv run pytest tests/integration/ -v"
description = "Cassette-driven integration tests (offline)"
