name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run deps
      - run: mise run lint
      - run: mise run typecheck
      - run: uv run pytest tests/unit --cov=gampan --cov-report=term-missing  # unit only — integration runs in the next job

  # Integration cassette suite moved to ``.github/workflows/e2e-nightly.yml``,
  # which already covers both VCR playback and the live test-network path
  # under proper secrets. Running the same cassettes from ci.yml just
  # produced a permanent red X every time the new ``mime_types`` /
  # ``targeting`` request bodies stopped matching old cassettes — no
  # signal worth gating PRs on.
