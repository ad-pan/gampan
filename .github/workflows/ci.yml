name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: latest
      - run: mise run deps
      - run: mise run lint
      - run: mise run typecheck
      - run: uv run pytest --cov=gampan --cov-report=term-missing  # keep coverage flag inline

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: latest
      - run: mise run deps
      - run: mise run validate
