name: release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      # Three parallel runners ship the three per-arch binaries Homebrew
      # picks from. macos-14 (Apple Silicon) appears twice — once for
      # native arm64, once cross-compiling x86_64 via Nuitka's
      # ``--macos-target-arch`` — so neither macOS slice waits on the
      # other and ``macos-13`` (deprecated, slow free-tier queue) is
      # gone for good.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: gampan-linux-x86_64
          - os: macos-14
            artifact: gampan-darwin-arm64
          - os: macos-14
            artifact: gampan-darwin-x86_64
            macos_arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run deps
      - env:
          # Unset by default → ``mise run build`` skips the
          # ``--macos-target-arch`` flag (native build). The x86_64
          # macOS row sets it explicitly to cross-compile.
          NUITKA_MACOS_ARCH: ${{ matrix.macos_arch }}
        run: mise run release-build
      - run: mv dist/gampan dist/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  changesets:
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - uses: changesets/action@v1
        with:
          publish: pnpm dlx @changesets/cli publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
