name: release

on:
  # knope-bot creates the GitHub release (tag + changelog body) when the
  # release PR — e.g. "Release 0.1.1" — is merged. This workflow reacts to
  # that release event and only attaches per-arch onefile binaries.
  release:
    types: [published]
  # Manual escalation hatch: re-build + re-upload binaries for an existing
  # tag (e.g. when a CI runner died mid-build and the release ended up
  # missing one artifact).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build + upload binaries for (e.g. v0.1.1)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # arm64 macOS + linux x86_64 only. Intel macOS x86_64 was dropped
      # because cross-compiling from macos-14 needs a universal2 Python
      # which neither mise nor setup-python provides, and macos-13 is
      # deprecated. Intel Mac users install via `pipx`/`pip` from PyPI.
      matrix:
        os: [ubuntu-latest, macos-14]
    # Need write to upload assets to the release.
    permissions:
      contents: write
    steps:
      - id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "value=${EVENT_TAG:-$INPUT_TAG}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.value }}
      - uses: jdx/mise-action@v4
      - run: mise run deps
      - run: mise run release-build
      - name: Rename to platform-tagged filename
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            mv dist/gampan dist/gampan-darwin-arm64
          else
            mv dist/gampan dist/gampan-linux-x86_64
          fi
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
        run: gh release upload --clobber "$TAG" dist/gampan-*
