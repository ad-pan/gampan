name: release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      # arm64 macOS + linux x86_64 only. Intel macOS x86_64 was dropped
      # because cross-compiling from macos-14 needs a universal2 Python
      # which neither mise nor setup-python provides, and macos-13 is
      # deprecated. Intel Mac users install via `pipx`/`pip` from PyPI.
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: mise run deps
      - run: mise run release-build
      - name: Rename to platform-tagged filename
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            mv dist/gampan dist/gampan-darwin-arm64
          else
            mv dist/gampan dist/gampan-linux-x86_64
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: gampan-${{ matrix.os }}
          path: dist/gampan-*

  knope:
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4

      - id: knope
        run: |
          if mise exec -- knope prepare-release --dry-run >/dev/null 2>&1; then
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.knope.outputs.has_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "knope-release-bot"
          git config user.email "actions@users.noreply.github.com"
          mise exec -- knope release

      - if: steps.knope.outputs.has_release == 'true'
        uses: actions/download-artifact@v8
        with:
          path: artefacts
          merge-multiple: true

      - if: steps.knope.outputs.has_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver=$(grep -E '^version *=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          gh release upload "v$ver" \
            artefacts/gampan-darwin-arm64 \
            artefacts/gampan-linux-x86_64
