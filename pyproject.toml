[project]
name = "gampan"
version = "0.1.0"
description = "Declarative IaC CLI for Google Ad Manager"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Sejun Jeong", email = "sejun@zigbang.com" }]
keywords = ["google-ad-manager", "iac", "ad-tech", "ad-pan"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "structlog>=24.1",
    "rich>=13.7",
    "googleads>=44.0",
    "google-ads-admanager>=0.4",
    "google-auth-oauthlib>=1.2",
    "keyring>=25.0",
    "tenacity>=8.4",
]

[project.scripts]
gampan = "gampan.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "vcrpy>=6.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "nuitka>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gampan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: opt-in tests requiring real GAM sandbox network",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.*"]
ignore_missing_imports = true
