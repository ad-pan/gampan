[package]
versioned_files = ["pyproject.toml"]
changelog = "CHANGELOG.md"

[github]
owner = "ad-pan"
repo = "gampan"

# https://github.com/apps/knope-bot — PR doc check + Release-PR preview.
[bot.checks]
enabled = true

[bot.releases]
enabled = true

[[workflows]]
name = "document-change"
[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "prepare-release"
[[workflows.steps]]
type = "PrepareRelease"

[[workflows]]
name = "release"
[[workflows.steps]]
type = "PrepareRelease"
[[workflows.steps]]
type = "Command"
# knope's `Command` step is split via shell-words (no real shell), so `&&`
# cannot chain — every token would land as an arg to `git add`. Stage and
# commit as separate steps to keep explicit staging without sweeping
# unrelated tracked edits.
command = "git add pyproject.toml CHANGELOG.md .changeset"
[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare release $version\""
[[workflows.steps]]
type = "Command"
command = "git push origin HEAD"
[[workflows.steps]]
type = "Release"
